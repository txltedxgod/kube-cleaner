[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-cleaner"
version = "1.0.0"
description = "Kubernetes cluster housekeeping daemon for reaping evicted pods, completed jobs and stale resources"
authors = [{ name = "txltedxgod", email = "seidoutakidzava@gmail.com" }]
dependencies = [
    "kubernetes>=28.1.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "pyyaml>=6.0.1"
]
readme = "README.md"
requires-python = ">=3.10"
